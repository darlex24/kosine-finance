# Render blueprint. Deploys the API only — the Next.js frontend belongs on
# Vercel, which builds and serves it far better than a container would.
#
# Every secret below is marked sync:false: Render prompts for them on first
# deploy and stores them in its own vault, so they never sit in this repo.
services:
  - type: web
    name: kosine-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        # Stays at 1 deliberately: the rate limiter and OCR quota are
        # per-process, so more workers silently multiply both limits. Raise it
        # only after wiring a shared store.
        value: "1"
      - key: CORS_ORIGINS
        sync: false   # the deployed frontend URL, e.g. https://kosine.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # bypasses RLS — never commit, never log
      - key: SUPABASE_RECEIPT_BUCKET
        value: receipts
      - key: OPENAI_API_KEY
        sync: false
      - key: CURRENT_TAX_YEAR
        value: "2026"
